name: Build APK

# Builds an Android app from index.html every time you change it.
# You can also start it by hand: Actions tab > Build APK > Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/build.yml

permissions:
  contents: write

env:
  APP_NAME: Tally
  APP_ID: com.deepak.tally

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the Android app around index.html
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          mkdir -p www
          cp index.html www/index.html
          printf '{"appId":"%s","appName":"%s","webDir":"www","server":{"androidScheme":"https"}}' "$APP_ID" "$APP_NAME" > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Allow notifications and alarms
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE; do
            sed -i "s#</manifest>#<uses-permission android:name=\"android.permission.$P\"/></manifest>#" "$MANIFEST"
          done
          grep -c "uses-permission" "$MANIFEST"

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../$APP_NAME.apk"

      - name: Keep a copy in the run
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APP_NAME }}.apk

      - name: Publish a download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest "$APP_NAME.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$APP_NAME APK" --notes "Latest build. Open this page on your phone and tap the APK file to download it."
